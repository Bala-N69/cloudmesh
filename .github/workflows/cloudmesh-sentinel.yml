name: CloudMesh Sentinel Checks

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Detroit"

  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q cloudmesh_sentinel tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner demo
        run: python cloudmesh_sentinel/cli.py examples/demo-plan.json

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: Azure/setup-kubectl@v5.1.0

      - name: Validate Kustomize development overlay
        run: bash scripts/validate-kubernetes.sh

  codeql:
    name: Analyze Python security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v4
