name: CloudMesh Sentinel Checks

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * 1"
      timezone: "America/Detroit"

  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner demo
        run: python cloudmesh_sentinel/cli.py examples/demo-plan.json