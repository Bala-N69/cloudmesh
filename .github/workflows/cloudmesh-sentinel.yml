name: CloudMesh Sentinel Checks

on:
  workflow_dispatch:

  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Detroit"

  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run scanner tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q cloudmesh_sentinel tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run scanner demo
        run: python cloudmesh_sentinel/cli.py examples/demo-plan.json

      - name: Verify scanner demo findings
        run: |
          demo_output="$(python cloudmesh_sentinel/cli.py examples/demo-plan.json)"
          printf '%s\n' "$demo_output"
          grep -Fq "CloudMesh Sentinel: 3 finding(s)" <<< "$demo_output"
          grep -Fq "[HIGH] google_compute_firewall.allow_ssh" <<< "$demo_output"
          grep -Fq "[HIGH] google_storage_bucket_iam_member.public_read" <<< "$demo_output"
          grep -Fq "[HIGH] google_compute_instance.web" <<< "$demo_output"

      - name: Verify scanner safe plan
        run: |
          safe_output="$(python cloudmesh_sentinel/cli.py examples/safe-plan.json)"
          printf '%s\n' "$safe_output"
          grep -Fq "CloudMesh Sentinel: 0 finding(s)" <<< "$safe_output"

      - name: Enforce GCP plan severity gate
        run: |
          python cloudmesh_sentinel/cli.py examples/safe-plan.json --format json --fail-on medium
          status=0
          python cloudmesh_sentinel/cli.py examples/gcp-network-risk-plan.json --format json --fail-on high || status=$?
          test "$status" -eq 1

  container:
    name: Build and test Sentinel container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDMESH_DOCKER_TEST_IMAGE: cloudmesh-sentinel:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build local test image
        run: docker build --pull --tag "$CLOUDMESH_DOCKER_TEST_IMAGE" .

      - name: Run container integration tests
        run: python -m unittest discover -s tests -p test_container.py -v

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: Azure/setup-kubectl@v5.1.0

      - name: Validate Kustomize development overlay
        run: bash scripts/validate-kubernetes.sh

  codeql:
    name: Analyze Python security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Analyze code
        uses: github/codeql-action/analyze@v4
